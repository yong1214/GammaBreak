name: GammaBreak
options:
  bundleIdPrefix: com.gammabreak
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
targets:
  GammaBreak:
    type: application
    platform: iOS
    sources:
      - path: GammaBreak
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gammabreak.app
        INFOPLIST_FILE: GammaBreak/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
